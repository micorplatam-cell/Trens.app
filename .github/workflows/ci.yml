name: CI

on:
  push:
    branches: [main, main-*]
  pull_request:
    branches: [main, main-*]

env:
  CI: true
  EXPO_NO_PROMPT: 1

jobs:
  lint-and-type-check:
    name: 🔍 Lint & Type Check
    runs-on: ubuntu-latest

    steps:
      - name: 🔽 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci --legacy-peer-deps

      - name: 🔍 Run ESLint
        run: npm run lint
        continue-on-error: true

      - name: 🔎 Type check
        run: npm run type-check
        continue-on-error: true

      - name: ✅ All checks passed
        run: echo "✅ Code quality checks passed!"

  # Expo Doctor Check
  expo-check:
    name: 🏗️ Expo Check
    runs-on: ubuntu-latest

    steps:
      - name: 🔽 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci --legacy-peer-deps

      - name: 🔧 Setup Expo
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
        continue-on-error: true

      - name: ✅ Expo Doctor
        run: npx expo-doctor
        continue-on-error: true
