name: 📡 Notify on Deploy

on:
  push:
    branches: [main, main-*]
  workflow_dispatch:

jobs:
  notify:
    name: 📱 WhatsApp Notification
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    steps:
      - name: 🔽 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: 📝 Get commit info
        id: commit
        run: |
          echo "message=$(git log -1 --pretty=%B | head -1)" >> $GITHUB_OUTPUT
          echo "author=$(git log -1 --pretty=%an)" >> $GITHUB_OUTPUT
          echo "sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: 📱 WhatsApp Notification (CallMeBot)
        if: ${{ secrets.CALLMEBOT_PHONE != '' && secrets.CALLMEBOT_APIKEY != '' }}
        run: |
          MESSAGE="🚀 TRENS Deploy: ${{ steps.commit.outputs.message }} (${{ steps.commit.outputs.sha }})"
          ENCODED=$(echo "$MESSAGE" | sed 's/ /%20/g')
          curl -s "https://api.callmebot.com/whatsapp.php?phone=${{ secrets.CALLMEBOT_PHONE }}&text=${ENCODED}&apikey=${{ secrets.CALLMEBOT_APIKEY }}"
          echo "✅ WhatsApp notification sent!"

      - name: ⚠️ No secrets configured
        if: ${{ secrets.CALLMEBOT_PHONE == '' || secrets.CALLMEBOT_APIKEY == '' }}
        run: |
          echo "⚠️ WhatsApp secrets not configured. Add CALLMEBOT_PHONE and CALLMEBOT_APIKEY in Settings > Secrets"
