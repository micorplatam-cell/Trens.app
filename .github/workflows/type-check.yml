name: TypeScript Type Check

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  type-check:
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout código
        uses: actions/checkout@v4
      
      - name: 🟢 Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: 📦 Instalar dependencias
        run: npm install --legacy-peer-deps
      
      - name: 🔍 Ejecutar type-check
        run: npm run type-check
      
      - name: ✅ Type-check exitoso
        if: success()
        run: echo "✅ No se encontraron errores de TypeScript"
      
      - name: ❌ Type-check falló
        if: failure()
        run: echo "❌ Se encontraron errores de TypeScript. Revisa los logs arriba."
